{% extends "base.html" %}
{% block title %}Eliminar producto · TechLogix S.A.{% endblock %}
{% block content %}
<h1>Eliminar producto</h1>
<p>¿Seguro que deseas eliminar <strong>{{ object.nombre }}</strong> (<span class="mono">{{ object.sku }}</span>)? Esta acción no se puede deshacer.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn danger-btn" type="submit">Sí, eliminar</button>
  <a href="{% url 'admin_panel' %}">Cancelar</a>
</form>
{% endblock %}
